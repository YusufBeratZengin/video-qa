[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-qa"
version = "0.1.0"
description = "Local quality gates for rendered videos using FFmpeg"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Yusuf Berat Zengin"}]
keywords = [
  "ffmpeg",
  "video",
  "quality",
  "ci",
  "remotion",
  "shorts",
  "reels",
  "tiktok",
  "loudness",
  "ebu-r128",
  "junit",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Multimedia :: Video",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]
dependencies = ["tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
ffmpeg = ["imageio-ffmpeg>=0.5"]
dev = ["ruff>=0.9", "build>=1", "mypy>=1.10"]

[project.scripts]
video-qa = "video_qa.cli:main"

[project.urls]
Homepage = "https://github.com/YusufBeratZengin/video-qa"
Source = "https://github.com/YusufBeratZengin/video-qa"
Changelog = "https://github.com/YusufBeratZengin/video-qa/blob/main/CHANGELOG.md"
Issues = "https://github.com/YusufBeratZengin/video-qa/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
video_qa = ["py.typed"]

[tool.mypy]
strict = true
files = ["src/video_qa"]

[[tool.mypy.overrides]]
module = ["imageio_ffmpeg", "imageio_ffmpeg.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
