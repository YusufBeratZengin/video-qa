[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-qa"
version = "0.1.0"
description = "Local quality gates for rendered videos using FFmpeg"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yusuf Berat Zengin"}]
keywords = ["ffmpeg", "video", "quality", "ci"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = ["tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
ffmpeg = ["imageio-ffmpeg>=0.5"]
dev = ["ruff>=0.9", "build>=1"]

[project.scripts]
video-qa = "video_qa.cli:main"

[project.urls]
Homepage = "https://github.com/YusufBeratZengin/video-qa"
Issues = "https://github.com/YusufBeratZengin/video-qa/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[[tool.mypy.overrides]]
module = ["imageio_ffmpeg", "imageio_ffmpeg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
