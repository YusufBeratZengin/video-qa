<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 402" width="100%" height="402">
  <defs>
    <linearGradient id="terminal-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#30363d" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#21262d" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="terminal-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <style>
      .code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
        font-size: 13px;
        white-space: pre;
      }
      .title { fill: #8b949e; font-size: 12px; font-weight: 500; }
      .prompt { fill: #58a6ff; font-weight: 600; }
      .cmd { fill: #f0f6fc; font-weight: 600; }
      .meta { fill: #8b949e; }
      .hdr { fill: #8b949e; font-weight: 600; }
      .pass { fill: #3fb950; font-weight: 700; }
      .warn { fill: #d29922; font-weight: 700; }
      .fail { fill: #f85149; font-weight: 700; }
      .rule { fill: #79c0ff; }
      .detail { fill: #c9d1d9; }
      .summary { fill: #e6edf3; font-weight: 600; }
    </style>
  </defs>

  <g filter="url(#terminal-shadow)">
    <rect x="10" y="10" width="800" height="382" rx="10" ry="10" fill="#0d1117" stroke="url(#terminal-border)" stroke-width="1"/>
    <rect x="10" y="10" width="800" height="42" rx="10" ry="10" fill="#161b22"/>
    <rect x="10" y="40" width="800" height="12" fill="#161b22"/>
    <line x1="10" y1="52" x2="810" y2="52" stroke="#21262d" stroke-width="1"/>

    <!-- Window Controls -->
    <circle cx="32" cy="28" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5"/>
    <circle cx="52" cy="28" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5"/>
    <circle cx="72" cy="28" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5"/>
    <text x="410.0" y="32" text-anchor="middle" class="code title">video-qa — terminal</text>
  </g>

  <!-- Terminal Content -->
  <g transform="translate(30, 74)">
    <text x="0" y="0" class="code"><tspan class="prompt">$ </tspan><tspan class="cmd">video-qa check out.mp4 --profile shorts</tspan></text>
    <text x="0" y="20" class="code meta">out.mp4 (profile: shorts, probe: ffmpeg)</text>
    <text x="0" y="40" class="code hdr">STATUS  CHECK           DETAIL</text>
    <text x="0" y="60" class="code"><tspan class="pass">PASS    </tspan><tspan class="rule">resolution      </tspan><tspan class="detail">Display raster 1080x1920; expected 1080x1920</tspan></text>
    <text x="0" y="80" class="code"><tspan class="pass">PASS    </tspan><tspan class="rule">aspect_ratio    </tspan><tspan class="detail">Display aspect 0.56250; expected 0.56250</tspan></text>
    <text x="0" y="100" class="code"><tspan class="pass">PASS    </tspan><tspan class="rule">fps             </tspan><tspan class="detail">Average 30.000 fps; allowed 24-60</tspan></text>
    <text x="0" y="120" class="code"><tspan class="pass">PASS    </tspan><tspan class="rule">duration        </tspan><tspan class="detail">3.000s; allowed 0.1-60s</tspan></text>
    <text x="0" y="140" class="code"><tspan class="pass">PASS    </tspan><tspan class="rule">freeze          </tspan><tspan class="detail">Longest 0.000s across 0 event(s); allowed &lt;= 1.5s</tspan></text>
    <text x="0" y="160" class="code"><tspan class="pass">PASS    </tspan><tspan class="rule">black           </tspan><tspan class="detail">Longest 0.000s across 0 event(s); allowed &lt;= 0.5s</tspan></text>
    <text x="0" y="180" class="code"><tspan class="pass">PASS    </tspan><tspan class="rule">silence         </tspan><tspan class="detail">Longest 0.000s across 0 event(s); allowed &lt;= 2s</tspan></text>
    <text x="0" y="200" class="code"><tspan class="pass">PASS    </tspan><tspan class="rule">audio           </tspan><tspan class="detail">Audio stream present</tspan></text>
    <text x="0" y="220" class="code"><tspan class="pass">PASS    </tspan><tspan class="rule">clipping        </tspan><tspan class="detail">Sample peak -17.687953 dBFS; allowed &lt;= -0.1 dBFS</tspan></text>
    <text x="0" y="240" class="code"><tspan class="pass">PASS    </tspan><tspan class="rule">true_peak       </tspan><tspan class="detail">True peak -17.69 dBTP; allowed &lt;= -0.1 dBTP</tspan></text>
    <text x="0" y="260" class="code"><tspan class="warn">WARN    </tspan><tspan class="rule">loudness        </tspan><tspan class="detail">Integrated -21.8 LUFS; target -14 +/- 2</tspan></text>
    <text x="0" y="280" class="code"><tspan class="pass">PASS    </tspan><tspan class="rule">audio_coverage  </tspan><tspan class="detail">Video extends 0.000s beyond audio; allowed &lt;= 2s</tspan></text>
    <text x="0" y="300" class="code summary">PASS: 0 failure(s), 1 warning(s)</text>
  </g>
</svg>
